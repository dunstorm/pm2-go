syntax = "proto3";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

package proto;

option go_package = ".";

service ProcessManager {
    rpc StopProcess (StopProcessRequest) returns (StopProcessResponse) {}
    rpc FindProcess (FindProcessRequest) returns (Process) {}
    rpc DeleteProcess (DeleteProcessRequest) returns (DeleteProcessResponse) {}
    rpc ListProcess (ListProcessRequest) returns (ListProcessResponse) {}
    rpc SpawnProcess (SpawnProcessRequest) returns (SpawnProcessResponse) {}
    rpc RestartProcess (RestartProcessRequest) returns (Process) {}
    rpc FlushProcess (FlushProcessRequest) returns (FlushProcessResponse) {}
}

message ProcStatus {
    string status = 1;
    google.protobuf.Timestamp started_at = 2;
    google.protobuf.Duration  uptime   = 3;
    int32  restarts   = 4;
    string cpu = 5;
    string memory = 6;
    int32 parent_pid = 7;
}

message Process {
    int32 id = 1;
    string name = 2;
    repeated string args = 3;
    repeated string scripts = 4;
    string executable_path = 5;
    int32 pid = 6;
    bool auto_restart = 7;
    string cwd = 8;
    string pid_file_path = 9;
    string log_file_path = 10;
    string err_file_path = 11;
    string cron_restart = 12;
    google.protobuf.Timestamp next_start_at = 13;
    
    ProcStatus proc_status = 14;
    bool stop_signal = 15;
    int32 log_file_count = 16;
    map<string, string> env = 17;
    int32 max_restarts = 18;
    int32 min_uptime_ms = 19;
    int32 restart_delay_ms = 20;
    int32 exp_backoff_restart_delay_ms = 21;
    int64 max_memory_restart = 22;
    int32 unstable_restarts = 23;
    int32 current_restart_delay_ms = 24;
    google.protobuf.Timestamp restart_at = 25;
    string health_check_url = 26;
    int32 health_check_interval_ms = 27;
    int32 health_check_timeout_ms = 28;
    google.protobuf.Timestamp last_health_check_at = 29;
    bool watch = 30;
    repeated string watch_paths = 31;
    int32 watch_interval_ms = 32;
    map<string, int64> watch_signatures = 33;
    google.protobuf.Timestamp last_watch_check_at = 34;
}

message FindProcessRequest {
    string name = 1;
}

message StopProcessRequest {
    string name = 1;
    int32 id = 2;
}

message StopProcessResponse {
    bool success = 1;
}

message ListProcessRequest {}

message ListProcessResponse {
    repeated Process processes = 1;
}

message DeleteProcessRequest {
    int32 id = 1;
}

message DeleteProcessResponse {
    bool success = 1;
}

message FlushProcessRequest {
    int32 id = 1;
}

message FlushProcessResponse {
    bool success = 1;
    repeated string log_file_paths = 2;
}

message SpawnProcessRequest {
    string name = 1;
    repeated string args = 2;
    repeated string scripts = 3;
    string executable_path = 4;
    bool auto_restart = 6;
    string cwd = 7;
    string cron_restart = 11;
    map<string, string> env = 12;
    int32 max_restarts = 13;
    int32 min_uptime_ms = 14;
    int32 restart_delay_ms = 15;
    int32 exp_backoff_restart_delay_ms = 16;
    int64 max_memory_restart = 17;
    string health_check_url = 18;
    int32 health_check_interval_ms = 19;
    int32 health_check_timeout_ms = 20;
    bool watch = 21;
    repeated string watch_paths = 22;
    int32 watch_interval_ms = 23;
}

message SpawnProcessResponse {
    bool success = 1;
}

message RestartProcessRequest {
    int32 id = 1;
    string name = 2;
    repeated string args = 3;
    repeated string scripts = 4;
    string executable_path = 5;
    bool auto_restart = 7;
    string cwd = 8;
    string cron_restart = 12;
    map<string, string> env = 13;
    bool graceful = 14;
    string signal = 15;
    int32 kill_timeout_ms = 16;
    int32 max_restarts = 17;
    int32 min_uptime_ms = 18;
    int32 restart_delay_ms = 19;
    int32 exp_backoff_restart_delay_ms = 20;
    int64 max_memory_restart = 21;
    string health_check_url = 22;
    int32 health_check_interval_ms = 23;
    int32 health_check_timeout_ms = 24;
    bool watch = 25;
    repeated string watch_paths = 26;
    int32 watch_interval_ms = 27;
}
